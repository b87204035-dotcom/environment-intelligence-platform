name: Monthly official data sync
on:
  schedule:
    - cron: '17 2 1 * *'
  workflow_dispatch:
concurrency:
  group: official-data-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install ./backend
      - name: Run due official-source imports
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOURCE_SNAPSHOT_DIR: /tmp/source-snapshots
        run: python scripts/sync_sources.py --due
