name: Monthly official data sync
on:
  schedule:
    - cron: '15 18 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/m1-gis-platform-foundation
      - name: Download and audit official datasets
        env:
          MOENV_CONTAMINATED_SITES_URL: ${{ secrets.MOENV_CONTAMINATED_SITES_URL }}
          MOENV_CONTROL_ZONES_URL: ${{ secrets.MOENV_CONTROL_ZONES_URL }}
          NLSC_PARCEL_ENDPOINT: ${{ secrets.NLSC_PARCEL_ENDPOINT }}
        run: python scripts/sync_official_data.py
      - name: Commit sync outputs when changed
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/sync/status.json data/raw || true
          git diff --cached --quiet || git commit -m "chore(data): synchronize official datasets"
          git push origin HEAD:codex/m1-gis-platform-foundation
