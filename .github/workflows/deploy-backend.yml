name: Build and deploy backend
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
concurrency: {group: production-backend, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    outputs: {image: '${{ steps.image.outputs.value }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
      - id: image
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY}/api:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with: {host: '${{ secrets.DEPLOY_HOST }}', username: '${{ secrets.DEPLOY_USER }}', key: '${{ secrets.DEPLOY_SSH_KEY }}', source: deploy/compose.production.yaml, target: /opt/eip}
      - uses: appleboy/ssh-action@v1.2.0
        env: {API_IMAGE: '${{ needs.build.outputs.image }}'}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: API_IMAGE
          script: cd /opt/eip && API_IMAGE="$API_IMAGE" docker compose --env-file /opt/eip/.env -f deploy/compose.production.yaml pull && API_IMAGE="$API_IMAGE" docker compose --env-file /opt/eip/.env -f deploy/compose.production.yaml up -d --remove-orphans
