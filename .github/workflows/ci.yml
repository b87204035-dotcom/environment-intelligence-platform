name: CI
on:
  push:
    branches: [main, codex/**]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config
      - name: Build API
        run: docker compose build api
      - name: Python syntax check
        run: python -m py_compile apps/api/app/main.py
