[project]
name = "eip-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.116.1", "uvicorn[standard]==0.35.0", "psycopg[binary,pool]==3.2.9", "pydantic-settings==2.10.1", "httpx==0.28.1", "alembic==1.16.4", "sqlalchemy==2.0.42", "openai==1.98.0"]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
pythonpath=["."]
